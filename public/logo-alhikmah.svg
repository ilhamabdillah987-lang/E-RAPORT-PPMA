<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Text Paths for Circular Text -->
    <path id="topTextArc" d="M 98,250 A 152,152 0 1,1 402,250" fill="none" />
    <path id="bottomTextArc" d="M 402,250 A 152,152 0 0,1 98,250" fill="none" />
    
    <!-- Gold gradient for rim and shield -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfa938" />
      <stop offset="50%" stop-color="#f8c95a" />
      <stop offset="100%" stop-color="#c68a1a" />
    </linearGradient>

    <!-- Green gradient for emblem background -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d8222" />
      <stop offset="100%" stop-color="#2a5f15" />
    </linearGradient>
  </defs>

  <!-- Drop Shadow Filter for realism -->
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" />
  </filter>

  <!-- 1. Outer Floral Emblem Crest (5 Petals with pointed tips) -->
  <g filter="url(#shadow)">
    <!-- Gold Border Layer -->
    <path d="M 250,10
             C 278,55 350,68 375,85
             C 405,105 450,135 482,185
             C 455,225 435,275 442,320
             C 450,370 435,420 395,472
             C 345,465 295,470 250,490
             C 205,470 155,465 105,472
             C 65,420 50,370 58,320
             C 65,275 45,225 18,185
             C 50,135 95,105 125,85
             C 150,68 222,55 250,10 Z"
          fill="url(#greenGradient)"
          stroke="url(#goldGradient)"
          stroke-width="7"
          stroke-linejoin="round" />
  </g>

  <!-- 2. Circular Ring Container -->
  <!-- Outer Ring Stroke -->
  <circle cx="250" cy="250" r="172" fill="#ffffff" stroke="#111111" stroke-width="4.5" />
  
  <!-- Inner Ring Stroke -->
  <circle cx="250" cy="250" r="126" fill="#ffffff" stroke="#111111" stroke-width="3.5" />

  <!-- 3. Text on Ring -->
  <!-- PESANTREN MODERN (Top Arc) -->
  <text font-family="'Cinzel', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="28" fill="#111111" letter-spacing="3.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">PESANTREN MODERN</textPath>
  </text>

  <!-- Left Star ★ -->
  <text x="96" y="260" font-family="Arial, sans-serif" font-weight="bold" font-size="26" fill="#111111" text-anchor="middle">★</text>

  <!-- Right Star ★ -->
  <text x="404" y="260" font-family="Arial, sans-serif" font-weight="bold" font-size="26" fill="#111111" text-anchor="middle">★</text>

  <!-- AL-HIKMAH (Bottom Arc) -->
  <text font-family="'Cinzel', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="31" fill="#111111" letter-spacing="4">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">AL-HIKMAH</textPath>
  </text>

  <!-- 4. Yellow/Gold Pentagon Center Shield -->
  <polygon points="250,142 364,220 326,358 174,358 136,220"
           fill="#f3a71f"
           stroke="#111111"
           stroke-width="4"
           stroke-linejoin="round" />

  <!-- 5. Open Book (Holy Quran / Kitab) inside Pentagon -->
  <!-- Book Spine / Backing -->
  <path d="M 172,305 L 250,312 L 328,305 L 333,292 L 250,298 L 167,292 Z" fill="#b97c0f" stroke="#111111" stroke-width="2" />
  
  <!-- Book Pages (Open Left Page & Right Page) -->
  <!-- Left Page -->
  <path d="M 250,298 C 215,296 185,286 166,288 L 176,204 C 205,202 235,212 250,214 Z"
        fill="#ffffff"
        stroke="#111111"
        stroke-width="3"
        stroke-linejoin="round" />
  <!-- Right Page -->
  <path d="M 250,298 C 285,296 315,286 334,288 L 324,204 C 295,202 265,212 250,214 Z"
        fill="#ffffff"
        stroke="#111111"
        stroke-width="3"
        stroke-linejoin="round" />

  <!-- Gold/Yellow Page Trim Lines -->
  <path d="M 170,285 C 190,283 225,292 248,294" fill="none" stroke="#e69c1a" stroke-width="2" />
  <path d="M 330,285 C 310,283 275,292 252,294" fill="none" stroke="#e69c1a" stroke-width="2" />

  <!-- Horizontal Text Lines on Left Page -->
  <line x1="184" y1="220" x2="238" y2="225" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
  <line x1="181" y1="232" x2="240" y2="237" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
  <line x1="179" y1="244" x2="242" y2="249" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
  <line x1="176" y1="256" x2="244" y2="261" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
  <line x1="174" y1="268" x2="246" y2="273" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />

  <!-- Horizontal Text Lines on Right Page -->
  <line x1="262" y1="225" x2="316" y2="220" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
  <line x1="260" y1="237" x2="319" y2="232" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
  <line x1="258" y1="249" x2="321" y2="244" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
  <line x1="256" y1="261" x2="324" y2="256" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />
  <line x1="254" y1="273" x2="326" y2="268" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />

  <!-- Book Center Crease Divider -->
  <line x1="250" y1="214" x2="250" y2="298" stroke="#111111" stroke-width="3" />

  <!-- 6. Fountain Pen (Pena) Above Book -->
  <g transform="translate(0, 5)">
    <!-- Pen Nib Point -->
    <polygon points="245,204 250,214 255,204" fill="#ffffff" stroke="#111111" stroke-width="2" />
    <line x1="250" y1="204" x2="250" y2="212" stroke="#111111" stroke-width="1.5" />
    <!-- Pen Grip & Body -->
    <path d="M 245,204 L 261,152 C 263,147 271,150 269,155 L 255,204 Z" fill="#ffffff" stroke="#111111" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Pen Clip -->
    <path d="M 268,154 L 263,178" stroke="#111111" stroke-width="3" stroke-linecap="round" />
    <circle cx="262" cy="180" r="2" fill="#111111" />
  </g>

  <!-- 7. White Banner for Arabic Text الحكمة (Al-Hikmah) -->
  <path d="M 185,322 L 315,322 L 305,350 L 195,350 Z" fill="#ffffff" stroke="#111111" stroke-width="2" stroke-linejoin="round" />

  <!-- Arabic Script: الحكمة -->
  <text x="250" y="344"
        font-family="'Amiri', 'Traditional Arabic', 'Scheherazade New', serif"
        font-size="28"
        font-weight="bold"
        fill="#111111"
        text-anchor="middle"
        letter-spacing="1">
    الحكمة
  </text>
</svg>
